type: baseline
# DDI-334 (ddibn) KGE: HetioNet bio edges (334 drug nodes only, rel 0-22) + 334-drug TWOSIDES train split (typed rel 23+). No DrugBank DDI edges.
# Relation renumbering: see relation_map.json. n_relations=232 (23 bio + TWOSIDES type count)
# HP: AstraZeneca/kgem-in-drug-discovery (kge_hetionet config as-is)
dataset: emergnn
n_relations: 232

data:
  kg: /path/to/internal_server/v5_ddi-bench/experiment/ddi334/kge/kg_bio_334.txt
  ddi_train: /path/to/internal_server/v5_ddi-bench/experiment/ddi334/kge/ddibn/ddi_train.txt

model:
  name: RotatE
  embedding_dim: 512

optimizer:
  class: Adagrad
  lr: 0.03

train:
  loss_function: MarginRankingLoss
  num_epoch: 500
  num_negative: 41
  create_inverse: False

save:
  path: /path/to/internal_server/v5_ddi-bench/experiment/ddi334/kge/ddibn/rotate

seed: 42
