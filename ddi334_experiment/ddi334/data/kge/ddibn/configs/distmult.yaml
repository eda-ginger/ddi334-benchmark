type: baseline
# DDI-334 (ddibn) KGE: HetioNet bio(334 약물 노드만, rel 0-22) + 334 TWOSIDES train(typed rel 23+). DrugBank DDI 없음.
# 관계 재번호: relation_map.json 참조. n_relations=232 (bio 23 + TWOSIDES type 수)
# HP: AstraZeneca/kgem-in-drug-discovery (kge_hetionet/config 그대로)
dataset: emergnn
n_relations: 232

data:
  kg: /home/rudwls2717/Latex/experiments/v5_ddi-bench/experiment/ddi334/kge/kg_bio_334.txt
  ddi_train: /home/rudwls2717/Latex/experiments/v5_ddi-bench/experiment/ddi334/kge/ddibn/ddi_train.txt

model:
  name: DistMult
  embedding_dim: 80

optimizer:
  class: Adagrad
  lr: 0.02

train:
  loss_function: MarginRankingLoss
  num_epoch: 400
  num_negative: 41
  create_inverse: False

save:
  path: /home/rudwls2717/Latex/experiments/v5_ddi-bench/experiment/ddi334/kge/ddibn/distmult

seed: 42
